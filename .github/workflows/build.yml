name: build-flavor

# 1 branche = 1 saveur : base, nvidia, rocm, printer, full.
# Push sur une branche => build de SA saveur -> GHCR :<branche>-<sha>.
# Runner : self-hosted NixOS avec podman (pas de buildah/apt ici).
# Secrets requis : néant en public (GITHUB_TOKEN suffit pour GHCR public).

on:
  push:
    branches: [base, nvidia, rocm, printer, full]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # minuscules obligatoires (le owner GitHub a une majuscule)
  IMAGE_NAME: swam-web/mon-bootc

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Saveur depuis la branche
        id: flavor
        run: |
          case "${{ github.ref_name }}" in
            base|nvidia|rocm|printer|full) echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "Branche ${{ github.ref_name }} non mappée"; exit 1 ;;
          esac
          n=0; r=0; p=0
          case "${{ github.ref_name }}" in
            nvidia) n=1 ;;
            rocm) r=1 ;;
            printer) p=1 ;;
            full) n=1; r=1; p=1 ;;
          esac
          echo "nvidia=$n" >> "$GITHUB_OUTPUT"
          echo "rocm=$r" >> "$GITHUB_OUTPUT"
          echo "printer=$p" >> "$GITHUB_OUTPUT"

      - name: Login GHCR (podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Podman build (saveur ${{ steps.flavor.outputs.name }})
        run: |
          podman build --pull=newer \
            --build-arg "WITH_NVIDIA=${{ steps.flavor.outputs.nvidia }}" \
            --build-arg "WITH_ROCM=${{ steps.flavor.outputs.rocm }}" \
            --build-arg "WITH_PRINTER=${{ steps.flavor.outputs.printer }}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.flavor.outputs.name }}-${{ github.sha }}" \
            -f ./Containerfile .

      - name: Podman push
        run: |
          podman push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.flavor.outputs.name }}-${{ github.sha }}"
