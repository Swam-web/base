name: build boots

on:
  push:
    branches: [base, nvidia, rocm, printer]
  workflow_dispatch: {}

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (base)
        run: echo "Image base built locally via build-all.sh"
  
  build-nvidia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (nvidia)
        run: echo "Image nvidia built locally via build-all.sh"
  
  build-rocm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (rocm)
        run: echo "Image rocm built locally via build-all.sh"
  
  build-printer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (printer)
        run: echo "Image printer built locally via build-all.sh"
