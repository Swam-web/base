name: build boots

on:
  push:
    branches: [base, nvidia, rocm, printer]
  workflow_dispatch: {}

jobs:
  build-base:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos-bootc/bootc-image-builder:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build bootc image (base)
        run: |
          chmod +x ./build/build.sh
          ./build/build.sh localhost/mon-bootc:latest base

  build-nvidia:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos-bootc/bootc-image-builder:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build bootc image (nvidia)
        run: |
          chmod +x ./build/build.sh
          WITH_NVIDIA=1 ./build/build.sh localhost/mon-bootc:nvidia nvidia

  build-rocm:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos-bootc/bootc-image-builder:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build bootc image (rocm)
        run: |
          chmod +x ./build/build.sh
          WITH_ROCM=1 ./build/build.sh localhost/mon-bootc:rocm rocm

  build-printer:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos-bootc/bootc-image-builder:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build bootc image (printer)
        run: |
          chmod +x ./build/build.sh
          WITH_PRINTER=1 ./build/build.sh localhost/mon-bootc:printer printer
