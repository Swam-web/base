name: build-flavors

# Builds matrice des saveurs bootc. Pousse vers GHCR.
# Secrets requis : néant en public (GITHUB_TOKEN suffit pour GHCR public).
# Images lourdes (~5 Go) : préfère un runner self-hosted (runs-on: self-hosted).
# Pour tester vite avec le runner gratuit : ne garder que la matrice voulue.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mon-bootc

jobs:
  build:
    # Pour runner maison : remplacer par [self-hosted]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, nvidia, rocm, printer, full]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk (runners GitHub gratuits UNIQUEMENT)
        if: startsWith(runner.name, 'GitHub Actions')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildah build (saveur ${{ matrix.flavor }})
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ matrix.flavor }}-${{ github.sha }}
          containerfiles: ./Containerfile
          build-args: |
            WITH_NVIDIA=${{ contains(fromJSON('["nvidia", "full"]'), matrix.flavor) && '1' || '0' }}
            WITH_ROCM=${{ contains(fromJSON('["rocm", "full"]'), matrix.flavor) && '1' || '0' }}
            WITH_PRINTER=${{ contains(fromJSON('["printer", "full"]'), matrix.flavor) && '1' || '0' }}

      - name: Push GHCR
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}
